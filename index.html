<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Youth Baseball Lineup</title>
  
  <!-- React (using development for better error messages) -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  
  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚾</text></svg>">
  
  <!-- PWA meta tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#007AFF">
</head>
<body>
  <div id="root">
    <!-- Loading state -->
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 48px; margin-bottom: 16px;">⚾</div>
        <div style="color: #86868b;">Loading...</div>
      </div>
    </div>
  </div>

  <!-- Application Scripts (loaded in dependency order) -->
  <script type="text/babel" src="js/constants.js"></script>
  <script type="text/babel" src="js/storage.js"></script>
  <script type="text/babel" src="js/solver.js"></script>
  <script type="text/babel" src="js/components.js"></script>
  <script type="text/babel" src="js/modals.js"></script>
  <script type="text/babel" src="js/LineupGrid.js"></script>
  <script type="text/babel" src="js/views.js"></script>
  <script type="text/babel" src="js/app.js"></script>
</body>
</html>
